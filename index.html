<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventario - Acceso</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <form id="form-login" class="login-box">
            <h2>Iniciar Sesión</h2>
            <div class="form-group">
                <label for="input-email">Correo Electrónico</label>
                <input type="email" id="input-email" required placeholder="tu@correo.com">
            </div>
            <div class="form-group">
                <label for="input-password">Contraseña</label>
                <input type="password" id="input-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary">Ingresar al Sistema</button>
        </form>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
